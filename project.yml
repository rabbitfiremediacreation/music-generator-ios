name: MusicGeneratorRemote
options:
  bundleIdPrefix: de.alphatester
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MusicGeneratorRemote:
    type: application
    platform: iOS
    sources:
      - MusicGeneratorRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.alphatester.music-generator-remote
        PRODUCT_NAME: Music Generator
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Music Generator
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Die App verbindet sich mit dem Music Generator auf deinem Mac im Heimnetz."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TEAMID   # Lee Esposito (Personal Team), App läuft 7 Tage
    info:
      path: MusicGeneratorRemote/Info.plist
      properties:
        UIBackgroundModes: [audio]
        # Geladene Songs in der Dateien-App unter „Auf meinem iPhone › Music Generator“
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # QR-Code aus der Web-App: musicgenerator://connect?server=…&alt=…&token=…
        CFBundleURLTypes:
          - CFBundleURLName: de.alphatester.music-generator-remote
            CFBundleURLSchemes: [musicgenerator]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
